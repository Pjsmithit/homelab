apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-html
  namespace: homepage
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>K3s Dashboard</title>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 20px;
        }
        .container {
          background: white;
          border-radius: 10px;
          box-shadow: 0 10px 40px rgba(0,0,0,0.2);
          padding: 40px;
          max-width: 600px;
          width: 100%;
        }
        h1 {
          color: #333;
          margin-bottom: 10px;
          text-align: center;
        }
        .subtitle {
          color: #666;
          text-align: center;
          margin-bottom: 30px;
          font-size: 14px;
        }
        .links {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 15px;
        }
        .link-card {
          padding: 20px;
          background: #f5f5f5;
          border-radius: 8px;
          text-decoration: none;
          color: #333;
          transition: all 0.3s ease;
          text-align: center;
          border: 2px solid transparent;
        }
        .link-card:hover {
          background: #667eea;
          color: white;
          border-color: #667eea;
          transform: translateY(-2px);
        }
        .link-card h3 {
          margin-bottom: 5px;
          font-size: 16px;
        }
        .link-card p {
          font-size: 12px;
          opacity: 0.8;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>🚀 K3s Dashboard</h1>
        <p class="subtitle">Quick access to your cluster services</p>
        <div class="links">
          <a href="http://argocd.local" class="link-card" target="_blank">
            <h3>ArgoCD</h3>
            <p>GitOps Deployments</p>
          </a>
          <a href="http://traefik.local/dashboard/" class="link-card" target="_blank">
            <h3>Traefik</h3>
            <p>Ingress Controller</p>
          </a>
          <a href="#" class="link-card">
            <h3>Kubernetes</h3>
            <p>API Server</p>
          </a>
          <a href="#" class="link-card">
            <h3>Monitoring</h3>
            <p>Coming Soon</p>
          </a>
        </div>
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
      - name: nginx
        image: nginx:1.21-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: html
        configMap:
          name: homepage-html
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  type: NodePort
  selector:
    app: homepage
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
spec:
  rules:
  - host: homepage.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homepage
            port:
              number: 80
