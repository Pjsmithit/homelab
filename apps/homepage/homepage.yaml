apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-html
  namespace: homepage
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>K3s Dashboard</title>
    </head>
    <body>
      <div class="container">
        <h1>🚀 K3s Dashboard</h1>
        <p class="subtitle">Quick access to your cluster services</p>
        <div class="links">
          <a href="https://192.168.1.141:8006/" class="link-card" target="_blank">
            <h3>Proxmox - Node 1</h3>
            <p>Proxmox Nodes</p>
          </a>
          <a href="https://192.168.1.142:8006/" class="link-card" target="_blank">
            <h3>Proxmox - Node 2</h3>
            <p>Proxmox Nodes</p>
          </a>
          <a href="https://192.168.1.150/" class="link-card" target="_blank">
            <h3>vCentre</h3>
            <p>VMware Nodes</p>
          </a>          
          <a href="https://192.168.1.151/" class="link-card" target="_blank">
            <h3>ESX - Node 1</h3>
            <p>VMware Nodes</p>
          </a>
          <a href="https://192.168.1.152/" class="link-card" target="_blank">
            <h3>ESX - Node 2</h3>
            <p>VMware Nodes</p>
          </a>


        
          <a href="http://argocd.local" class="link-card" target="_blank">
            <h3>ArgoCD</h3>
            <p>GitOps Deployments</p>
          </a>
          <a href="http://traefik.local/dashboard/" class="link-card" target="_blank">
            <h3>Traefik</h3>
            <p>Ingress Controller</p>
          </a>
          <a href="#" class="link-card">
            <h3>Kubernetes</h3>
            <p>API Server</p>
          </a>
          <a href="#" class="link-card">
            <h3>Monitoring</h3>
            <p>Coming Soon</p>
          </a>
        </div>
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
      - name: nginx
        image: nginx:1.21-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: html
        configMap:
          name: homepage-html
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  type: NodePort
  selector:
    app: homepage
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
spec:
  rules:
  - host: homepage.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homepage
            port:
              number: 80
